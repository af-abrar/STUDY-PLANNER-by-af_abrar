<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Helper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0a0e27;
        }

        /* RGB Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, 
                #ff006e, #8338ec, #3a86ff, #06ffa5);
            background-size: 400% 400%;
            animation: rgbShift 8s ease infinite;
            opacity: 0.1;
            z-index: -1;
        }

        @keyframes rgbShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 600px;
            width: 90%;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff, #06ffa5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header p {
            color: #ccc;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .study-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease;
            transition: all 0.3s ease;
        }

        .study-box:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 40px rgba(255, 0, 110, 0.2);
        }

        .ai-button {
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 0, 110, 0.4);
            position: relative;
            overflow: hidden;
        }

        .ai-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8338ec, #3a86ff);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .ai-button:hover::before {
            left: 0;
        }

        .ai-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(255, 0, 110, 0.6);
        }

        .ai-button:active {
            transform: translateY(-1px) scale(0.98);
            animation: clickPulse 0.5s ease;
        }

        @keyframes clickPulse {
            0% {
                box-shadow: 0 6px 30px rgba(255, 0, 110, 0.6);
            }
            50% {
                box-shadow: 0 6px 40px rgba(51, 56, 236, 0.8);
            }
            100% {
                box-shadow: 0 6px 30px rgba(255, 0, 110, 0.6);
            }
        }

        .selected-ai {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 0, 110, 0.1);
            border-left: 4px solid #ff006e;
            border-radius: 10px;
            color: #ccc;
            text-align: center;
            display: none;
            animation: slideInLeft 0.5s ease;
        }

        .selected-ai.active {
            display: block;
        }

        .selected-ai p {
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .selected-ai strong {
            color: #ff006e;
            font-size: 1.3rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(20, 20, 50, 0.95), rgba(30, 30, 60, 0.95));
            border: 1px solid rgba(255, 0, 110, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 50px rgba(255, 0, 110, 0.4);
            animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popUp {
            0% {
                transform: scale(0.3) rotate(-5deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-header h2 {
            color: #ff006e;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .modal-header p {
            color: #aaa;
            font-size: 0.95rem;
        }

        .ai-options {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .ai-option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ccc;
            font-weight: 600;
        }

        .ai-option:hover {
            border-color: #ff006e;
            background: rgba(255, 0, 110, 0.1);
            transform: translateX(5px);
        }

        .ai-option.selected {
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.2), rgba(51, 56, 236, 0.2));
            border-color: #ff006e;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }

        .ai-icon {
            font-size: 1.5rem;
            min-width: 30px;
        }

        .ai-info {
            flex: 1;
        }

        .ai-info-name {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 4px;
        }

        .ai-info-desc {
            font-size: 0.8rem;
            color: #999;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 0, 110, 0.3);
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 0, 110, 0.5);
        }

        .btn-confirm:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .study-box {
                padding: 30px 20px;
            }

            .modal-content {
                padding: 30px 20px;
            }

            .ai-option {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 AI Study Helper</h1>
            <p>Choose your AI Assistant</p>
        </div>

        <div class="study-box">
            <button class="ai-button" id="aiButton">
                🤖 Select AI Assistant
            </button>

            <div class="selected-ai" id="selectedAI">
                <p>Currently Using:</p>
                <strong id="selectedName">-</strong>
            </div>
            <!-- OpenAI key UI removed per request -->
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="aiModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Choose Your AI</h2>
                <p>Select the AI assistant you want to use</p>
            </div>

            <div class="ai-options">
                <div class="ai-option" data-ai="gemini">
                    <div class="ai-icon">✨</div>
                    <div class="ai-info">
                        <div class="ai-info-name">Google Gemini</div>
                        <div class="ai-info-desc">Advanced multimodal AI</div>
                    </div>
                </div>

                <div class="ai-option" data-ai="chatgpt">
                    <div class="ai-icon">🟢</div>
                    <div class="ai-info">
                        <div class="ai-info-name">ChatGPT</div>
                        <div class="ai-info-desc">OpenAI's powerful model</div>
                    </div>
                </div>

                <div class="ai-option" data-ai="deepseek">
                    <div class="ai-icon">🔷</div>
                    <div class="ai-info">
                        <div class="ai-info-name">DeepSeek</div>
                        <div class="ai-info-desc">Fast reasoning engine</div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="modal-btn btn-cancel" id="cancelBtn">Cancel</button>
                <button class="modal-btn btn-confirm" id="confirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div class="modal" id="chatModal">
        <div class="modal-content">
            <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <h2 id="chatHeader">Chat</h2>
                    <p id="chatSub" style="color:#aaa;font-size:0.9rem;">Talk to AI</p>
                </div>
                <button class="modal-btn btn-cancel" id="closeChat" style="flex:0 0 auto;padding:8px 12px;">Close</button>
            </div>

            <div id="chatMessages" class="chat-messages" style="margin-top:10px;max-height:360px;overflow-y:auto;padding:10px;border-radius:8px;background:rgba(255,255,255,0.02);">
            </div>

            <div style="display:flex;gap:8px;margin-top:16px;">
                <input id="chatInput" placeholder="Type a message..." style="flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff;outline:none;" />
                <button class="modal-btn btn-confirm" id="sendChat" style="padding:12px 18px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        const aiButton = document.getElementById('aiButton');
        const aiModal = document.getElementById('aiModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const aiOptions = document.querySelectorAll('.ai-option');
        const selectedAIDiv = document.getElementById('selectedAI');
        const selectedName = document.getElementById('selectedName');

        let selectedAI = localStorage.getItem('selectedAI') || null;

        const aiNames = {
            'gemini': 'Google Gemini',
            'chatgpt': 'ChatGPT',
            'deepseek': 'DeepSeek'
        };

        // Initialize selected AI display
        if (selectedAI) {
            updateSelectedDisplay();
        }

        // Open modal
        aiButton.addEventListener('click', () => {
            aiModal.classList.add('show');
            aiButton.style.transform = 'scale(0.95)';
            setTimeout(() => {
                aiButton.style.transform = 'scale(1)';
            }, 200);
        });

        // Close modal
        cancelBtn.addEventListener('click', closeModal);

        function closeModal() {
            aiModal.classList.remove('show');
        }

        // Select AI option
        aiOptions.forEach(option => {
            option.addEventListener('click', () => {
                aiOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                selectedAI = option.dataset.ai;
                // Open chat immediately for this AI
                openChat(selectedAI);
            });

            // Initialize if already selected
            if (selectedAI === option.dataset.ai) {
                option.classList.add('selected');
            }
        });

        // Confirm selection
        confirmBtn.addEventListener('click', () => {
            if (selectedAI) {
                localStorage.setItem('selectedAI', selectedAI);
                updateSelectedDisplay();
                closeModal();
                confirmBtn.style.animation = 'clickPulse 0.5s ease';
            }
        });


        // Open provider site in a centered popup window
        function openChat(aiKey){
            selectedAI = aiKey;
            updateSelectedDisplay();
            const urls = {
                'gemini': 'https://gemini.google.com/app',
                'chatgpt': 'https://chat.openai.com/',
                'deepseek': 'https://www.perplexity.ai/'
            };
            const url = urls[aiKey] || urls['chatgpt'];
            const w = 1000, h = 700;
            const left = window.screenX + Math.max(0, (window.outerWidth - w) / 2);
            const top = window.screenY + Math.max(0, (window.outerHeight - h) / 2);
            const features = `toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes,width=${w},height=${h},top=${top},left=${left}`;
            const popup = window.open(url, '_blank', features);
            if(popup) popup.focus();
        }

        function closeChat(){
            // kept for compatibility with internal chat UI (no-op when using external providers)
        }

        function appendMessage(who, text){
            const container = document.getElementById('chatMessages');
            const el = document.createElement('div');
            el.className = 'chat-message ' + (who === 'user' ? 'user' : 'ai');
            el.style.padding = '8px 10px';
            el.style.margin = '6px 0';
            el.style.borderRadius = '8px';
            el.style.maxWidth = '85%';
            if(who === 'user'){
                el.style.background = 'linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03))';
                el.style.alignSelf = 'flex-end';
                el.style.color = '#fff';
                el.style.marginLeft = 'auto';
            } else {
                el.style.background = 'rgba(255,255,255,0.02)';
                el.style.color = '#e6e6e6';
                el.style.alignSelf = 'flex-start';
                el.style.border = '1px solid rgba(255,255,255,0.02)';
            }
            el.innerText = text;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        // Call server-side proxy at /api/chat. The server holds the API key securely.
        async function callOpenAI(message){
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data.error || JSON.stringify(data));
            // Try to extract the assistant text from OpenAI-style response
            return data.choices?.[0]?.message?.content ?? data.text ?? JSON.stringify(data);
        }

        async function sendChat(){
            const input = document.getElementById('chatInput');
            const v = input.value.trim();
            if(!v) return;
            appendMessage('user', v);
            input.value = '';
            appendMessage('ai', 'Typing...');
            try{
                const resp = await callOpenAI(v);
                const container = document.getElementById('chatMessages');
                const aiEls = container.querySelectorAll('.chat-message.ai');
                if(aiEls.length) aiEls[aiEls.length-1].innerText = resp;
                else appendMessage('ai', resp);
            }catch(err){
                const msg = err && err.message ? err.message : String(err);
                const container = document.getElementById('chatMessages');
                const aiEls = container.querySelectorAll('.chat-message.ai');
                if(aiEls.length) aiEls[aiEls.length-1].innerText = 'Error: ' + msg;
                else appendMessage('ai', 'Error: ' + msg);
            }
        }

        // Wire up chat modal buttons
        document.addEventListener('DOMContentLoaded', ()=>{
            const closeChatBtn = document.getElementById('closeChat');
            const sendChatBtn = document.getElementById('sendChat');
            const chatInput = document.getElementById('chatInput');

            if(closeChatBtn) closeChatBtn.addEventListener('click', closeChat);
            if(sendChatBtn) sendChatBtn.addEventListener('click', sendChat);
            if(chatInput) chatInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); sendChat(); } });
        });

        function updateSelectedDisplay() {
            selectedName.textContent = aiNames[selectedAI];
            selectedAIDiv.classList.add('active');
        }

        // Close modal on outside click
        aiModal.addEventListener('click', (e) => {
            if (e.target === aiModal) {
                closeModal();
            }
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && aiModal.classList.contains('show')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
